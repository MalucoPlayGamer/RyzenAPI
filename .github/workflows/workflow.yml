name: Fetch Upstream & Patch ZIPs

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *' # Checa se há atualizações a cada 30 minutos
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Forzar re-parcheo de todos los ZIPs'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout seu repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar último commit do Skyflare
        id: cache-sha
        uses: actions/cache@v4
        with:
          path: .last_sha
          key: last-upstream-sha

      - name: Checar se o Skyflare postou algo novo
        id: check
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
        run: |
          UPSTREAM_SHA=$(curl -sf \
            "https://api.github.com/repos/$UPSTREAM_OWNER/$UPSTREAM_REPO/commits/main" \
            | jq -r '.sha')

          LAST_SHA=$(cat .last_sha 2>/dev/null || echo "")

          echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "last=$LAST_SHA"         >> $GITHUB_OUTPUT

          echo "Último commit do Skyflare:  $UPSTREAM_SHA"
          echo "Último que processamos:      $LAST_SHA"

          if [ "$UPSTREAM_SHA" != "$LAST_SHA" ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Há atualizações no repositório do Skyflare!"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Sem novidades no Skyflare. Parando por aqui."
          fi

      - name: Baixar e Comparar por Data os arquivos do Skyflare
        if: steps.check.outputs.changed == 'true'
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
        run: |
          echo "Baixando o repositório do Skyflare via ZIP temporário..."
          curl -sL "https://github.com/$UPSTREAM_OWNER/$UPSTREAM_REPO/archive/refs/heads/main.zip" -o /tmp/upstream.zip
          
          echo "Extraindo arquivos do Skyflare..."
          mkdir /tmp/upstream_files
          unzip -q /tmp/upstream.zip -d /tmp/upstream_files
          
          echo "Comparando arquivos por data de modificação..."
          # Mapeia a pasta extraída do Skyflare
          SOURCE_DIR="/tmp/upstream_files/Skyapi-main"
          
          # Preserva as datas originais dos commits do Skyflare usando os dados extraídos do zip
          # Varre todos os arquivos .zip vindos do repositório dele
          find "$SOURCE_DIR" -name "*.zip" | while read -r upstream_zip; do
            # Descobre o caminho relativo dele no seu repositório local
            rel_path="${upstream_zip#$SOURCE_DIR/}"
            local_zip="./$rel_path"
            
            # Se o arquivo não existir localmente no seu repositório, copia direto
            if [ ! -f "$local_zip" ]; then
              echo "  ➔ Arquivo novo detectado no Skyflare: $rel_path (Copiando)"
              mkdir -p "$(dirname "$local_zip")"
              cp "$upstream_zip" "$local_zip"
            else
              # Se o arquivo existir em ambos, compara as datas de modificação (mtime em segundos)
              upstream_time=$(stat -c %Y "$upstream_zip")
              local_time=$(stat -c %Y "$local_zip")
              
              if [ "$upstream_time" -gt "$local_time" ]; then
                echo "  ➔ O arquivo do Skyflare é MAIS NOVO: $rel_path (Atualizando)"
                cp "$upstream_zip" "$local_zip"
              else
                echo "  ➔ O SEU arquivo manual é mais recente ou igual: $rel_path (Mantendo o seu)"
              fi
            fi
          done
          
          echo "✓ Sincronização inteligente por data concluída!"

      - name: Detectar ZIPs para aplicar o Patch
        if: steps.check.outputs.changed == 'true'
        id: zips
        run: |
          find . -name "*.zip" -not -path "./.git/*" > /tmp/changed_zips.txt

          COUNT=$(wc -l < /tmp/changed_zips.txt)
          echo "==============================="
          echo "ZIPs prontos para processar: $COUNT"
          echo "==============================="
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Modificar LUA dentro dos ZIPs
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          TOTAL=$(wc -l < /tmp/changed_zips.txt)
          COUNT=0
          UPDATED=0
          REPO_DIR=$(pwd)

          while IFS= read -r zipfile; do
            [ -z "$zipfile" ] && continue

            COUNT=$((COUNT + 1))
            echo "[$COUNT/$TOTAL] Modificando ZIP: $zipfile"

            tmpdir=$(mktemp -d)
            unzip -q "$zipfile" -d "$tmpdir"

            luafile=$(find "$tmpdir" -name "*.lua" | head -1)
            if [ -z "$luafile" ]; then
              echo "  ⚠ Nenhum arquivo .lua dentro deste ZIP, pulando..."
              rm -rf "$tmpdir"
              continue
            fi

            # 1. Comenta a linha do setManifestid
            sed -i 's/^\(setManifestid(.*)\)/-- \1/' "$luafile"
            echo "  ✓ Linha setManifestid comentada"

            # 2. Substitui 'SkyAPI' por 'RyzenAPI'
            sed -i 's/SkyAPI/RyzenAPI/g' "$luafile"

            # 3. Formata o cabeçalho se for "Hubcap Manifest"
            if grep -q "Hubcap Manifest" "$luafile"; then
              echo "  ℹ Detectado cabeçalho antigo do Hubcap. Formatando..."
              GAMENAME=$(grep -E "^-- " "$luafile" | head -2 | tail -1 | sed 's/^-- //')
              if [[ "$GAMENAME" == *"Created by"* || -z "$GAMENAME" ]]; then
                GAMENAME=$(grep "addappid" "$luafile" | head -1 | awk -F'-- ' '{print $2}')
              fi
              sed -i '/^-- /d' "$luafile"
              NEW_HEADER="-- Lua provided by RyzenAPI\n-- Game: ${GAMENAME:-Jogo Desconhecido}"
              sed -i "1s/^/${NEW_HEADER}\n\n/" "$luafile"
              echo "  ✓ Novo cabeçalho formatado para RyzenAPI"
            fi

            # Recria o ZIP substituindo o antigo
            cd "$tmpdir"
            zip -q -r "$REPO_DIR/$zipfile" .
            cd "$REPO_DIR"

            rm -rf "$tmpdir"
            UPDATED=$((UPDATED + 1))
            echo "  ✓ ZIP atualizado com sucesso"

          done < /tmp/changed_zips.txt

      - name: Enviar modificações para o seu GitHub
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          STAGED=$(git diff --cached --name-only | grep '\.zip$' | wc -l || echo "0")
          echo "Total de ZIPs modificados/novos para enviar: $STAGED"

          if [ "$STAGED" -gt 0 ]; then
            git commit -m "bot: sincronização por data e padronização LUA efetuada para RyzenAPI"
            CURRENT_BRANCH=$(git branch --show-current)
            git push origin "$CURRENT_BRANCH"
            echo "✓ Alterações enviadas com sucesso!"
          else
            echo "Nenhuma mudança nova detectada nos arquivos."
          fi

      - name: Salvar registro do último commit processado
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ steps.check.outputs.upstream }}" > .last_sha
          echo "✓ Registro atualizado no cache"