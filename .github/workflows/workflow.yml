name: Fetch Upstream & Patch ZIPs

on:
  push:
    branches:
      - main
    paths:
      - '**.zip' # Acorda apenas quando arquivos ZIP forem atualizados ou adicionados
  schedule:
    - cron: '*/30 * * * *' # Checa o Skyflare de forma automatizada a cada 30 minutos
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Forçar re-processamento de todos os ZIPs'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' # Evita loops causados pelo próprio bot

    steps:
      - name: Checkout seu repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checar Origem do Disparo e Novidades
        id: check
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Obter o SHA mais recente do repositório upstream passando o token de autenticação
          UPSTREAM_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits" | jq -r '.[0].sha')
          
          if [ -z "$UPSTREAM_SHA" ] || [ "$UPSTREAM_SHA" = "null" ]; then
            echo "::error:: Não foi possível obter o commit mais recente do Skyflare via API."
            exit 1
          fi

          LAST_SHA=$(cat .last_sha 2>/dev/null || echo "")
          EVENT_NAME="${{ github.event_name }}"

          echo "Último commit do Skyflare: $UPSTREAM_SHA"
          echo "Último que processamos:    $LAST_SHA"

          if [ "$EVENT_NAME" = "push" ]; then
            echo "Disparo: PUSH MANUAL detectado."
            echo "mode=manual_push" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

          elif [ "$UPSTREAM_SHA" != "$LAST_SHA" ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            echo "✓ Nova atualização detectada no Skyflare!"
            echo "mode=upstream_sync" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

          else
            echo "Sem novidades para processar no momento."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sincronizar Upstream comparando Conteúdo (MD5)
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.mode == 'upstream_sync'
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/upstream
          echo "Baixando versão mais recente do Skyflare..."
          # Usando o cabeçalho de autenticação também no download do zipball
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/archive/refs/heads/main.zip" -o /tmp/upstream.zip
          unzip -q /tmp/upstream.zip -d /tmp/upstream

          UPSTREAM_DIR=$(find /tmp/upstream -mindepth 1 -maxdepth 1 -type d | head -n 1)

          # Passa por todos os ZIPs vindos do Skyflare
          find "$UPSTREAM_DIR" -type f -name "*.zip" | while read upstream_zip; do
            zipfile=$(basename "$upstream_zip")
            local_zip="./$zipfile"

            if [ -f "$local_zip" ]; then
              # Calcula MD5 para checar o conteúdo real, ignorando metadados de data
              upstream_md5=$(md5sum "$upstream_zip" | awk '{print $1}')
              local_md5=$(md5sum "$local_zip" | awk '{print $1}')

              if [ "$upstream_md5" != "$local_md5" ]; then
                echo "Atualizando $zipfile (Nova versão detectada no Skyflare)"
                cp "$upstream_zip" "$local_zip"
              else
                echo "Mantendo $zipfile (Conteúdo idêntico)"
              fi
            else
              echo "Novo arquivo adicionado do upstream: $zipfile"
              cp "$upstream_zip" "$local_zip"
            fi
          done
          rm -rf /tmp/upstream /tmp/upstream.zip

      - name: Identificar Estritamente os ZIPs Modificados
        id: zips
        if: steps.check.outputs.changed == 'true'
        run: |
          if [ "${{ steps.check.outputs.mode }}" = "manual_push" ]; then
            # Pega exatamente os arquivos alterados no seu push manual
            git diff --name-only HEAD~1 HEAD | grep -E '\.zip$' > /tmp/changed_zips.txt || true
          else
            # Sincronização automática: foca nos arquivos modificados localmente (pelo passo anterior)
            git status --porcelain | grep -E '\.zip$' | awk '{print $2}' > /tmp/changed_zips.txt || true
          fi

          COUNT=$(wc -l < /tmp/changed_zips.txt || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Arquivos afetados a processar: $COUNT"

      - name: Modificar LUA dentro dos ZIPs Alvos
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          REPO_DIR=$(pwd)
          
          while IFS= read -r zipfile; do
            [ -z "$zipfile" ] && continue
            echo "Processando patch e merge inteligente no arquivo: $zipfile"

            tmpdir=$(mktemp -d)
            
            # Se o arquivo já existe no seu repositório, extrai ele para comparar/fazer merge
            if [ -f "$REPO_DIR/$zipfile" ]; then
              mkdir -p "$tmpdir/local"
              unzip -q "$REPO_DIR/$zipfile" -d "$tmpdir/local"
            fi

            # Extrai o ZIP que veio do passo anterior (seja o novo do Skyflare ou o seu upload manual)
            mkdir -p "$tmpdir/incoming"
            unzip -q "$zipfile" -d "$tmpdir/incoming"

            # Processa os arquivos encontrados no pacote recebido
            find "$tmpdir/incoming" -type f -name "*.lua" | while read incoming_lua; do
              filename=$(basename "$incoming_lua")
              local_lua="$tmpdir/local/$filename"

              # 1. Descobrir o nome real do jogo (busca no arquivo recebido ou no local)
              REAL_GAMENAME=$(grep -E "addappid\([0-9]+\) --" "$incoming_lua" | head -n 1 | sed -E 's/.*--\s*//' | tr -d '\r')
              if [ -z "$REAL_GAMENAME" ] && [ -f "$local_lua" ]; then
                REAL_GAMENAME=$(grep -E "addappid\([0-9]+\) --" "$local_lua" | head -n 1 | sed -E 's/.*--\s*//' | tr -d '\r')
              fi
              if [ -z "$REAL_GAMENAME" ]; then
                REAL_GAMENAME=$(basename "$zipfile" .zip)
              fi

              # 2. Coletar e unificar os addappid de ambos os arquivos (Merge Inteligente)
              echo "Coletando appids do arquivo recebido..."
              grep -E "addappid\(" "$incoming_lua" | tr -d '\r' > "$tmpdir/appids.tmp"

              if [ -f "$local_lua" ]; then
                echo "Mesclando com appids do arquivo local existente..."
                grep -E "addappid\(" "$local_lua" | tr -d '\r' >> "$tmpdir/appids.tmp"
              fi

              # Filtra duplicatas mantendo a ordem ou uma estrutura limpa
              sort -u "$tmpdir/appids.tmp" | sort -V > "$tmpdir/appids_clean.tmp"

              # 3. Montar o arquivo final limpo
              printf -- "-- Lua provided by RyzenAPI\n-- Game: %s\n\n" "$REAL_GAMENAME" > "$incoming_lua"
              
              # Adiciona a seção principal do aplicativo se houver a declaração curta, separando visualmente
              if grep -E "addappid\([0-9]+\)$|addappid\([0-9]+\) --" "$tmpdir/appids_clean.tmp" | grep -v -q ","; then
                echo "-- MAIN APPLICATION" >> "$incoming_lua"
                grep -E "addappid\([0-9]+\)$|addappid\([0-9]+\) --" "$tmpdir/appids_clean.tmp" | grep -v "," >> "$incoming_lua"
                echo "" >> "$incoming_lua"
              fi

              # Adiciona os depots (linhas com parâmetros de hash/manifesto)
              if grep -q "," "$tmpdir/appids_clean.tmp"; then
                echo "-- MAIN APP DEPOTS" >> "$incoming_lua"
                grep "," "$tmpdir/appids_clean.tmp" >> "$incoming_lua"
              fi

              # 4. Substituições de string (SkyAPI -> RyzenAPI) no arquivo finalizado
              sed -i 's/SkyAPI/RyzenAPI/g' "$incoming_lua"
              sed -i 's/skyapi/ryzenapi/g' "$incoming_lua"
            done

            # Compacta novamente o ZIP atualizado com os arquivos mesclados
            cd "$tmpdir/incoming"
            zip -q -r "$REPO_DIR/$zipfile" .
            cd "$REPO_DIR"
            rm -rf "$tmpdir"
          done < /tmp/changed_zips.txt

      - name: Salvar registro do último commit processado
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.mode == 'upstream_sync'
        run: |
          echo "${{ steps.check.outputs.upstream }}" > .last_sha
          echo "✓ Registro do Skyflare guardado em .last_sha."

      - name: Enviar modificações corrigidas de volta para o GitHub
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.check.outputs.mode }}" = "upstream_sync" ]; then
            git add "*.zip" .last_sha
          else
            git add "*.zip"
          fi

          STAGED=$(git diff --cached --name-only | grep -E '\.zip$|\.last_sha$' | wc -l || echo "0")
          echo "Postando total de arquivos modificados: $STAGED"

          if [ "$STAGED" -gt 0 ]; then
            git commit -m "bot: patch e assinatura RyzenAPI aplicados cirurgicamente"
            CURRENT_BRANCH=$(git branch --show-current)
            git push origin "$CURRENT_BRANCH"
            echo "✓ Repositório atualizado com sucesso!"
          else
            echo "Nenhuma mudança real pendente para commitar."
          fi