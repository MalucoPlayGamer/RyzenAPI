name: Fetch Upstream & Patch ZIPs

on:
  push:
    branches:
      - main
    paths:
      - '**.zip' # Acorda apenas quando arquivos ZIP forem atualizados ou adicionados
  schedule:
    - cron: '*/30 * * * *' # Checa o Skyflare de forma automatizada a cada 30 minutos
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Forzar re-parcheo de todos los ZIPs'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    # PROTEÇÃO ESSENCIAL: Evita o loop ignorando execuções causadas pelo próprio bot actions
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout seu repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar último commit do Skyflare
        id: cache-sha
        uses: actions/cache@v4
        with:
          path: .last_sha
          key: last-upstream-sha

      - name: Checar Origem do Disparo e Novidades
        id: check
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
        run: |
          UPSTREAM_SHA=$(curl -sf \
            "https://api.github.com/repos/$UPSTREAM_OWNER/$UPSTREAM_REPO/commits/main" \
            | jq -r '.sha')

          LAST_SHA=$(cat .last_sha 2>/dev/null || echo "")

          echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "last=$LAST_SHA"         >> $GITHUB_OUTPUT

          echo "Último commit do Skyflare:  $UPSTREAM_SHA"
          echo "Último que processamos:      $LAST_SHA"

          # Se o gatilho foi o seu PUSH manual, ignoramos a trava do Skyflare e processamos suas mudanças locais
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "mode=manual_push" >> $GITHUB_OUTPUT
            echo "✓ Processando arquivos enviados manualmente por você!"
          elif [ "$UPSTREAM_SHA" != "$LAST_SHA" ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "mode=upstream_sync" >> $GITHUB_OUTPUT
            echo "✓ Nova atualização detectada no repositório do Skyflare!"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Sem novidades para processar no momento."
          fi

      - name: Sincronizar Upstream por Data (Se a atualização veio do Skyflare)
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.mode == 'upstream_sync'
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
        run: |
          echo "Baixando o repositório do Skyflare..."
          curl -sL "https://github.com/$UPSTREAM_OWNER/$UPSTREAM_REPO/archive/refs/heads/main.zip" -o /tmp/upstream.zip
          
          mkdir /tmp/upstream_files
          unzip -q /tmp/upstream.zip -d /tmp/upstream_files
          
          SOURCE_DIR="/tmp/upstream_files/Skyapi-main"
          
          find "$SOURCE_DIR" -name "*.zip" | while read -r upstream_zip; do
            rel_path="${upstream_zip#$SOURCE_DIR/}"
            local_zip="./$rel_path"
            
            if [ ! -f "$local_zip" ]; then
              mkdir -p "$(dirname "$local_zip")"
              cp "$upstream_zip" "$local_zip"
            else
              upstream_time=$(stat -c %Y "$upstream_zip")
              local_time=$(stat -c %Y "$local_zip")
              if [ "$upstream_time" -gt "$local_time" ]; then
                cp "$upstream_zip" "$local_zip"
              fi
            fi
          done

      - name: Identificar Estritamente os ZIPs Modificados
        if: steps.check.outputs.changed == 'true'
        id: zips
        run: |
          # Se o gatilho foi seu push manual, o bot pega APENAS os arquivos que mudaram no seu commit contra o commit anterior
          if [ "${{ steps.check.outputs.mode }}" = "manual_push" ]; then
            echo "Listando apenas arquivos que você modificou neste commit:"
            git diff --name-only HEAD^ HEAD | grep '\.zip$' > /tmp/changed_zips.txt || true
          else
            # Se veio do Skyflare ou full_sync, varre tudo para aplicar
            find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" > /tmp/changed_zips.txt
          fi

          COUNT=$(wc -l < /tmp/changed_zips.txt)
          echo "Quantidade de ZIPs para processar: $COUNT"
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Modificar LUA dentro dos ZIPs Alvos
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          TOTAL=$(wc -l < /tmp/changed_zips.txt)
          COUNT=0
          REPO_DIR=$(pwd)

          while IFS= read -r zipfile; do
            [ -z "$zipfile" ] && continue
            COUNT=$((COUNT + 1))
            echo "[$COUNT/$TOTAL] Aplicando Patch RyzenAPI no arquivo: $zipfile"

            tmpdir=$(mktemp -d)
            unzip -q "$zipfile" -d "$tmpdir"

            luafile=$(find "$tmpdir" -name "*.lua" | head -1)
            if [ -z "$luafile" ]; then
              rm -rf "$tmpdir"
              continue
            fi

            sed -i 's/^\(setManifestid(.*)\)/-- \1/' "$luafile"
            sed -i 's/SkyAPI/RyzenAPI/g' "$luafile"

            if grep -q "Hubcap Manifest" "$luafile"; then
              GAMENAME=$(grep -E "^-- " "$luafile" | head -2 | tail -1 | sed 's/^-- //')
              if [[ "$GAMENAME" == *"Created by"* || -z "$GAMENAME" ]]; then
                GAMENAME=$(grep "addappid" "$luafile" | head -1 | awk -F'-- ' '{print $2}')
              fi
              sed -i '/^-- /d' "$luafile"
              NEW_HEADER="-- Lua provided by RyzenAPI\n-- Game: ${GAMENAME:-Jogo Desconhecido}"
              sed -i "1s/^/${NEW_HEADER}\n\n/" "$luafile"
            fi

            cd "$tmpdir"
            zip -q -r "$REPO_DIR/$zipfile" .
            cd "$REPO_DIR"
            rm -rf "$tmpdir"
          done < /tmp/changed_zips.txt

      - name: Salvar registro do último commit processado
        # CORREÇÃO: Só salva o .last_sha se a atualização veio de fato do Skyflare!
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.mode == 'upstream_sync'
        run: |
          echo "${{ steps.check.outputs.upstream }}" > .last_sha
          echo "✓ Registro do Skyflare guardado com sucesso."

      - name: Enviar modificações corrigidas de volta para o GitHub
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Se foi push manual, não adiciona o .last_sha para não estragar o histórico do cron
          if [ "${{ steps.check.outputs.mode }}" = "upstream_sync" ]; then
            git add "*.zip" .last_sha
          else
            git add "*.zip"
          fi

          STAGED=$(git diff --cached --name-only | grep -E '\.zip$|\.last_sha$' | wc -l || echo "0")
          echo "Postando total de arquivos modificados: $STAGED"

          if [ "$STAGED" -gt 0 ]; then
            git commit -m "bot: patch e assinatura RyzenAPI aplicados cirurgicamente"
            CURRENT_BRANCH=$(git branch --show-current)
            git push origin "$CURRENT_BRANCH"
            echo "✓ Repositório atualizado e livre de loops!"
          else
            echo "Nenhuma mudança de estrutura pendente."
          fi