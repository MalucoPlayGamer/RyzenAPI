name: Fetch Upstream & Patch ZIPs

on:
  push:
    branches:
      - main
    paths:
      - '**.zip'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Forçar re-processamento de todos os ZIPs'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout seu repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checar Origem do Disparo e Novidades
        id: check
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits" | jq -r '.[0].sha')
          
          if [ -z "$UPSTREAM_SHA" ] || [ "$UPSTREAM_SHA" = "null" ]; then
            echo "::error:: Não foi possível obter o commit mais recente do Skyflare via API."
            exit 1
          fi

          LAST_SHA=$(cat .last_sha 2>/dev/null || echo "")
          EVENT_NAME="${{ github.event_name }}"

          echo "Último commit do Skyflare: $UPSTREAM_SHA"
          echo "Último que processamos:    $LAST_SHA"

          if [ "$EVENT_NAME" = "push" ]; then
            echo "Disparo: PUSH MANUAL detectado."
            echo "mode=manual_push" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

          elif [ "$UPSTREAM_SHA" != "$LAST_SHA" ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            echo "✓ Nova atualização detectada no Skyflare!"
            echo "mode=upstream_sync" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

          else
            echo "Sem novidades para processar no momento."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sincronizar Upstream e Isolar Novidades
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.mode == 'upstream_sync'
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/upstream
          mkdir -p /tmp/incoming_zips
          
          echo "Baixando versão mais recente do Skyflare..."
          curl -sL -H "Authorization: token $GH_TOKEN" \
            "https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/archive/refs/heads/main.zip" -o /tmp/upstream.zip
          unzip -q /tmp/upstream.zip -d /tmp/upstream

          UPSTREAM_DIR=$(find /tmp/upstream -mindepth 1 -maxdepth 1 -type d | head -n 1)

          # Passa por todos os ZIPs vindos do Skyflare
          find "$UPSTREAM_DIR" -type f -name "*.zip" | while read upstream_zip; do
            zipfile=$(basename "$upstream_zip")
            local_zip="./$zipfile"

            if [ -f "$local_zip" ]; then
              # Compara o MD5 interno dos arquivos .lua
              mkdir -p /tmp/md5_upstream /tmp/md5_local
              unzip -q "$upstream_zip" -d /tmp/md5_upstream
              unzip -q "$local_zip" -d /tmp/md5_local

              upstream_lua_md5=$(find /tmp/md5_upstream -type f -name "*.lua" -exec md5sum {} + | sort | md5sum | awk '{print $1}')
              local_lua_md5=$(find /tmp/md5_local -type f -name "*.lua" -exec md5sum {} + | sort | md5sum | awk '{print $1}')

              rm -rf /tmp/md5_upstream /tmp/md5_local

              if [ "$upstream_lua_md5" != "$local_lua_md5" ]; then
                echo "Modificação detectada em $zipfile -> Enviando para a fila de processamento."
                cp "$upstream_zip" /tmp/incoming_zips/"$zipfile"
              else
                echo "Conteúdo de $zipfile idêntico, ignorando."
              fi
            else
              echo "Novo arquivo do Skyflare detectado -> Enviando para a fila de processamento."
              cp "$upstream_zip" /tmp/incoming_zips/"$zipfile"
            fi
          done
          rm -rf /tmp/upstream /tmp/upstream.zip

      - name: Identificar Estritamente os ZIPs Modificados
        id: zips
        if: steps.check.outputs.changed == 'true'
        run: |
          if [ "${{ steps.check.outputs.mode }}" = "manual_push" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.event.after }}"
            
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --name-only -r "$AFTER_SHA" | grep -E '\.zip$' > /tmp/changed_zips.txt || true
            else
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -E '\.zip$' > /tmp/changed_zips.txt || true
            fi
          else
            mkdir -p /tmp/incoming_zips
            ls /tmp/incoming_zips | grep -E '\.zip$' > /tmp/changed_zips.txt || true
          fi

          COUNT=$(wc -l < /tmp/changed_zips.txt || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Arquivos afetados a processar: $COUNT"

      - name: Modificar LUA dentro dos ZIPs Alvos
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          REPO_DIR=$(pwd)
          MODE="${{ steps.check.outputs.mode }}"
          
          while IFS= read -r zipfile; do
            [ -z "$zipfile" ] && continue
            echo "Processando patch e merge inteligente no arquivo: $zipfile"

            tmpdir=$(mktemp -d)
            
            # 1. Isolar e extrair o arquivo LOCAL atual (se existir)
            if [ -f "$REPO_DIR/$zipfile" ]; then
              mkdir -p "$tmpdir/local"
              unzip -q "$REPO_DIR/$zipfile" -d "$tmpdir/local"
            fi

            # 2. Isolar e extrair o arquivo RECEBIDO (INCOMING)
            mkdir -p "$tmpdir/incoming"
            if [ "$MODE" = "manual_push" ]; then
              unzip -q "$REPO_DIR/$zipfile" -d "$tmpdir/incoming"
            else
              unzip -q /tmp/incoming_zips/"$zipfile" -d "$tmpdir/incoming"
            fi

            # 3. Executar o Merge Inteligente comparando as duas pastas limpas
            find "$tmpdir/incoming" -type f -name "*.lua" | while read incoming_lua; do
              filename=$(basename "$incoming_lua")
              local_lua="$tmpdir/local/$filename"
              APP_ID=$(basename "$zipfile" .zip)

              # --- CAPTURA INTELIGENTE E RESOLUÇÃO VIA API DO STEAM ---
              REAL_GAMENAME=""

              # Tentativa 1: Buscar no cabeçalho original do Hubcap (Geralmente linha 2)
              if [ -z "$REAL_GAMENAME" ]; then
                REAL_GAMENAME=$(grep -E "^-- [A-Za-z0-9]" "$incoming_lua" | grep -vE "Lua and Manifest|Created by|Website:|Total Depots:|provided by|Game:" | head -n 1 | sed -E 's/^--\s*//' | tr -d '\r')
              fi

              # Tentativa 2: Pegar da linha clássica do aplicativo base com comentário
              if [ -z "$REAL_GAMENAME" ]; then
                REAL_GAMENAME=$(grep -E "addappid\(" "$incoming_lua" | grep -vE "Depot|Content|Upgrade|Edition|Pack|Redist" | head -n 1 | sed -E 's/.*--\s*//' | tr -d '\r')
              fi

              # Tentativa 3: Olhar no arquivo local existente (se houver histórico válido)
              if [ -z "$REAL_GAMENAME" ] && [ -f "$local_lua" ]; then
                REAL_GAMENAME=$(grep -E "addappid\(.*\)\s*--" "$local_lua" | grep -vE "provided by|Game:|addappid" | head -n 1 | sed -E 's/.*--\s*//' | tr -d '\r')
              fi

              # Validação Crítica: Se o nome veio vazio, se é apenas um número, ou se contém comandos de script
              if [ -z "$REAL_GAMENAME" ] || [[ "$REAL_GAMENAME" =~ ^[0-9]+$ ]] || [[ "$REAL_GAMENAME" =~ "addappid" ]] || [[ "$REAL_GAMENAME" =~ ^Depot\ [0-9]+ ]]; then
                echo "Nome ausente ou inválido no arquivo LUA. Consultando API do Steam para o AppID: $APP_ID..."
                STEAM_NAME=$(curl -s "https://store.steampowered.com/api/appdetails?appids=$APP_ID" | jq -r ".\"$APP_ID\".data.name" 2>/dev/null || echo "")
                
                if [ ! -z "$STEAM_NAME" ] && [ "$STEAM_NAME" != "null" ]; then
                  REAL_GAMENAME="$STEAM_NAME"
                  echo "Nome resolvido com sucesso via Steam: $REAL_GAMENAME"
                else
                  REAL_GAMENAME="$APP_ID"
                fi
              fi
              # ----------------------------------------------------------------------

              # Unificar addappid E addtoken de ambos os lados sem perdas
              grep -E "addappid\(|addtoken\(" "$incoming_lua" | tr -d '\r' > "$tmpdir/lines.tmp"

              if [ -f "$local_lua" ]; then
                echo "Mesclando dados antigos locais com os novos do Skyflare..."
                grep -E "addappid\(|addtoken\(" "$local_lua" | tr -d '\r' >> "$tmpdir/lines.tmp"
              fi

              # Remove duplicatas E garante o alinhamento correto das DLCs/Tokens
              sort -u "$tmpdir/lines.tmp" | sort -V > "$tmpdir/lines_clean.tmp"

              # Montar o arquivo final limpo na pasta incoming
              printf -- "-- Lua provided by RyzenAPI\n-- Game: %s\n\n" "$REAL_GAMENAME" > "$incoming_lua"
              
              if grep -E "addappid\([0-9]+\)$|addappid\([0-9]+\) --" "$tmpdir/lines_clean.tmp" | grep -v -q ","; then
                echo "-- MAIN APPLICATION" >> "$incoming_lua"
                grep -E "addappid\([0-9]+\)$|addappid\([0-9]+\) --" "$tmpdir/lines_clean.tmp" | grep -v "," >> "$incoming_lua"
                echo "" >> "$incoming_lua"
              fi

              if grep -q "," "$tmpdir/lines_clean.tmp"; then
                echo "-- MAIN APP DEPOTS / PACKAGES" >> "$incoming_lua"
                grep "," "$tmpdir/lines_clean.tmp" >> "$incoming_lua"
              fi

              sed -i 's/SkyAPI/RyzenAPI/g' "$incoming_lua"
              sed -i 's/skyapi/ryzenapi/g' "$incoming_lua"
            done

            # 4. Compactar a pasta incoming estruturada diretamente para a raiz do seu repositório
            cd "$tmpdir/incoming"
            zip -q -r "$REPO_DIR/$zipfile" .
            cd "$REPO_DIR"
            rm -rf "$tmpdir"
          done < /tmp/changed_zips.txt
          
          rm -rf /tmp/incoming_zips

      - name: Salvar registro do último commit processado
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.mode == 'upstream_sync'
        run: |
          echo "${{ steps.check.outputs.upstream }}" > .last_sha
          echo "✓ Registro do Skyflare guardado em .last_sha."

      - name: Enviar modificações corrigidas de volta para o GitHub
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.check.outputs.mode }}" = "upstream_sync" ]; then
            git add "*.zip" .last_sha
          else
            git add "*.zip"
          fi

          STAGED=$(git diff --cached --name-only | grep -E '\.zip$|\.last_sha$' | wc -l || echo "0")
          echo "Postando total de arquivos modificados: $STAGED"

          if [ "$STAGED" -gt 0 ]; then
            git commit -m "bot: patch e assinatura RyzenAPI aplicados cirurgicamente"
            CURRENT_BRANCH=$(git branch --show-current)
            git push origin "$CURRENT_BRANCH"
            echo "✓ Repositório atualizado com sucesso!"
          else
            echo "Nenhuma mudança real pendente para commitar."
          fi