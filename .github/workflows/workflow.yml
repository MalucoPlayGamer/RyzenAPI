name: Fetch Upstream & Patch ZIPs

on:
  push:
    branches:
      - main
    paths:
      - '**.zip' # Acorda apenas quando arquivos ZIP forem atualizados ou adicionados
  schedule:
    - cron: '*/30 * * * *' # Checa o Skyflare de forma automatizada a cada 30 minutos
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Forçar re-processamento de todos os ZIPs'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    # PROTEÇÃO ESSENCIAL: Evita o loop ignorando execuções causadas pelo próprio bot actions
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout seu repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checar Origem do Disparo e Novidades
        id: check
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
        run: |
          # 1. Obter o SHA mais recente direto da API do repositório do Skyflare
          UPSTREAM_SHA=$(curl -sf "https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits/main" | jq -r '.sha')
          
          if [ -z "$UPSTREAM_SHA" ] || [ "$UPSTREAM_SHA" = "null" ]; then
            echo "::error:: Não foi possível obter o commit mais recente do Skyflare."
            exit 1
          fi

          # 2. Ler o SHA processado anteriormente salvo direto na branch
          LAST_SHA=$(cat .last_sha 2>/dev/null || echo "")

          echo "Último commit do Skyflare: $UPSTREAM_SHA"
          echo "Último que processamos:    $LAST_SHA"

          # 3. Identificar o tipo de evento que disparou o Workflow
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "push" ]; then
            echo "Disparo: PUSH MANUAL detectado no seu repositório."
            echo "mode=manual_push" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

          elif [ "$UPSTREAM_SHA" != "$LAST_SHA" ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            echo "✓ Nova atualização detectada no repositório do Skyflare!"
            echo "mode=upstream_sync" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

          else
            echo "Sem novidades para processar no momento."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sincronizar Upstream por Data (Se a atualização veio do Skyflare)
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.mode == 'upstream_sync'
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
        run: |
          mkdir -p /tmp/upstream
          echo "Baixando versão mais recente do Skyflare..."
          curl -sL "https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/archive/refs/heads/main.zip" -o /tmp/upstream.zip
          unzip -q /tmp/upstream.zip -d /tmp/upstream

          UPSTREAM_DIR=$(find /tmp/upstream -mindepth 1 -maxdepth 1 -type d | head -n 1)

          # Só copia o arquivo do Skyflare se ele for MAIS NOVO que o seu arquivo local
          find "$UPSTREAM_DIR" -type f -name "*.zip" | while read upstream_zip; do
            zipfile=$(basename "$upstream_zip")
            local_zip="./$zipfile"

            if [ -f "$local_zip" ]; then
              upstream_time=$(stat -c %Y "$upstream_zip")
              local_time=$(stat -c %Y "$local_zip")

              if [ "$upstream_time" -gt "$local_time" ]; then
                echo "Atualizando $zipfile (Versão do Skyflare é mais recente)"
                cp "$upstream_zip" "$local_zip"
              else
                echo "Mantendo $zipfile local (O seu arquivo é mais recente)"
              fi
            else
              echo "Novo arquivo adicionado: $zipfile"
              cp "$upstream_zip" "$local_zip"
            fi
          done
          rm -rf /tmp/upstream /tmp/upstream.zip

      - name: Identificar Estritamente os ZIPs Modificados
        id: zips
        if: steps.check.outputs.changed == 'true'
        run: |
          if [ "${{ steps.check.outputs.mode }}" = "manual_push" ]; then
            # Se você fez push manual, foca nos arquivos enviados nesse commit
            git diff --name-only HEAD~1 HEAD | grep -E '\.zip$' > /tmp/changed_zips.txt || true
          else
            # Se veio do schedule/sync, avalia todos os ZIPs do repositório
            git status --porcelain | grep -E '\.zip$' | awk '{print $2}' > /tmp/changed_zips.txt || true
            if [ ! -s /tmp/changed_zips.txt ]; then
              find . -maxdepth 1 -name "*.zip" -sed 's|^\./||' > /tmp/changed_zips.txt
            fi
          fi

          COUNT=$(wc -l < /tmp/changed_zips.txt || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Arquivos afetados a processar: $COUNT"

      - name: Modificar LUA dentro dos ZIPs Alvos
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          REPO_DIR=$(pwd)
          
          while IFS= read -r zipfile; do
            [ -z "$zipfile" ] && continue
            echo "Processando patch no arquivo: $zipfile"

            tmpdir=$(mktemp -d)
            unzip -q "$zipfile" -d "$tmpdir"

            luafile=$(find "$tmpdir" -type f -name "*.lua" | head -n 1)

            if [ -n "$luafile" ]; then
              # Altera SkyAPI para RyzenAPI no conteúdo do LUA
              sed -i 's/SkyAPI/RyzenAPI/g' "$luafile"
              sed -i 's/skyapi/ryzenapi/g' "$luafile"

              # Substitui cabeçalhos antigos ou insere a nova assinatura RyzenAPI
              if grep -q "\-\- Lua provided by" "$luafile"; then
                sed -i 's/\-\- Lua provided by.*/-- Lua provided by RyzenAPI/' "$luafile"
              else
                GAMENAME=$(echo "$zipfile" | sed 's/\.zip$//')
                NEW_HEADER="-- Lua provided by RyzenAPI\n-- Game: ${GAMENAME:-Jogo Desconhecido}"
                sed -i "1s/^/${NEW_HEADER}\n\n/" "$luafile"
              fi
            fi

            cd "$tmpdir"
            zip -q -r "$REPO_DIR/$zipfile" .
            cd "$REPO_DIR"
            rm -rf "$tmpdir"
          done < /tmp/changed_zips.txt

      - name: Salvar registro do último commit processado
        # Só atualiza a marcação .last_sha no repositório se a novidade veio de fato do Skyflare
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.mode == 'upstream_sync'
        run: |
          echo "${{ steps.check.outputs.upstream }}" > .last_sha
          echo "✓ Registro do Skyflare guardado em .last_sha."

      - name: Enviar modificações corrigidas de volta para o GitHub
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.check.outputs.mode }}" = "upstream_sync" ]; then
            git add "*.zip" .last_sha
          else
            git add "*.zip"
          fi

          STAGED=$(git diff --cached --name-only | grep -E '\.zip$|\.last_sha$' | wc -l || echo "0")
          echo "Postando total de arquivos modificados: $STAGED"

          if [ "$STAGED" -gt 0 ]; then
            git commit -m "bot: patch e assinatura RyzenAPI aplicados cirurgicamente"
            CURRENT_BRANCH=$(git branch --show-current)
            git push origin "$CURRENT_BRANCH"
            echo "✓ Repositório atualizado e sincronizado com sucesso!"
          else
            echo "Nenhuma mudança pendente a commit."
          fi