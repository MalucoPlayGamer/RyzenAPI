name: Fetch Upstream & Patch ZIPs

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Forçar re-processamento de todos os ZIPs'
        type: boolean
        default: false
      only_local_fix:
        description: 'Corrigir e re-processar APENAS os ZIPs locais do repositório'
        type: boolean
        default: false

concurrency:
  group: sync-and-patch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  check-runner:
    runs-on: ubuntu-latest
    outputs:
      target_runner: ${{ steps.set-runner.outputs.runner }}
    steps:
      - name: Checar disponibilidade do PC Local
        id: set-runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Consulta via API com cabeçalho de API aceito pelo GitHub
          RESPONSE=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners")
          
          # Debug para verificar se a API retornou os runners corretamente no log
          # echo "$RESPONSE"

          PC_ONLINE=$(echo "$RESPONSE" | jq -r '.runners[]? | select(.name == "MeuPC-Runner" and .status == "online") | .name')

          if [ -n "$PC_ONLINE" ]; then
            echo "🟢 Seu PC ($PC_ONLINE) está ONLINE! Executando no Docker local..."
            echo "runner=self-hosted" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Seu PC está OFFLINE ou inacessível via API! Usando fallback automático: ubuntu-latest..."
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
          fi

  # JOB PRINCIPAL: Executa na máquina escolhida dinamicamente
  sync-and-patch:
    needs: check-runner
    runs-on: ${{ needs.check-runner.outputs.target_runner }}
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout seu repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checar Origem do Disparo e Novidades
        id: check
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EVENT_NAME="${{ github.event_name }}"
          ONLY_LOCAL="${{ inputs.only_local_fix }}"

          # MODO: Correção Local Exclusiva
          if [ "$ONLY_LOCAL" = "true" ]; then
            echo "🔧 Modo CORREÇÃO LOCAL ativado. Ignorando chamadas ao Skyflare."
            echo "mode=local_only" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "upstream_news=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          UPSTREAM_SHA=$(curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits/main" | jq -r '.sha')
          
          if [ -z "$UPSTREAM_SHA" ] || [ "$UPSTREAM_SHA" = "null" ]; then
            echo "::error:: Não foi possível obter o commit mais recente do Skyflare via API."
            exit 1
          fi

          LAST_SHA=$(cat .last_sha 2>/dev/null || echo "")

          echo "Último commit do Skyflare: $UPSTREAM_SHA"
          echo "Último que processamos:    $LAST_SHA"

          HAS_UPSTREAM_NEWS="false"
          if [ "$UPSTREAM_SHA" != "$LAST_SHA" ] || [ "${{ inputs.full_sync }}" = "true" ]; then
            HAS_UPSTREAM_NEWS="true"
          fi

          echo "upstream_news=$HAS_UPSTREAM_NEWS" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Disparo: PUSH ou DISPATCH MANUAL detectado (checando diffs locais + upstream)."
            echo "mode=manual_push" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ "$HAS_UPSTREAM_NEWS" = "true" ]; then
            echo "✓ Nova atualização detectada no Skyflare via Cron!"
            echo "mode=upstream_sync" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Sem novidades para processar no momento."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Baixar ZIPs Alterados do Upstream (Se houver novidades)
        if: steps.check.outputs.changed == 'true' && (steps.check.outputs.mode == 'upstream_sync' || steps.check.outputs.upstream_news == 'true')
        env:
          UPSTREAM_OWNER: skyflarefox
          UPSTREAM_REPO: Skyapi
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream }}
        run: |
          mkdir -p /tmp/incoming_zips
          LAST_SHA=$(cat .last_sha 2>/dev/null || echo "")
          
          if [ "${{ inputs.full_sync }}" = "true" ] || [ -z "$LAST_SHA" ]; then
            echo "🔄 Modo FULL SYNC ativo. Baixando repositório mestre completo..."
            mkdir -p /tmp/upstream_master
            curl -sL -H "Authorization: token $GH_TOKEN" \
              "https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/archive/refs/heads/main.zip" -o /tmp/upstream.zip
            unzip -q /tmp/upstream.zip -d /tmp/upstream_master
            find /tmp/upstream_master -type f -name "*.zip" -exec cp {} /tmp/incoming_zips/ \;
            rm -rf /tmp/upstream_master /tmp/upstream.zip
          else
            echo "🔍 Analisando intervalo acumulado: $LAST_SHA até $UPSTREAM_SHA..."
            COMPARE_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/compare/${LAST_SHA}...${UPSTREAM_SHA}")
            
            if [ -z "$COMPARE_JSON" ] || [ "$(echo "$COMPARE_JSON" | jq -r '.status' 2>/dev/null)" = "behind" ]; then
              echo "⚠️ Fallback: Coletando commits recentes..."
              curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits?sha=main&per_page=10" | jq -r '.[].sha' > /tmp/recent_commits.txt
              > /tmp/files_to_download.txt
              while IFS= read -r c_sha; do
                curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commits/$c_sha" | jq -r '.files[]? | select(.status != "removed" and (.filename | endswith(".zip"))) | .filename' >> /tmp/files_to_download.txt
              done < /tmp/recent_commits.txt
            else
              echo "$COMPARE_JSON" | jq -r '.files[]? | select(.status != "removed" and (.filename | endswith(".zip"))) | .filename' > /tmp/files_to_download.txt
            fi

            sort -u /tmp/files_to_download.txt -o /tmp/files_to_download.txt
            while IFS= read -r remote_path; do
              [ -z "$remote_path" ] && continue
              zipfile=$(basename "$remote_path")
              echo "📥 Baixando do Skyflare: $zipfile"
              curl -sL -H "Authorization: token $GH_TOKEN" "https://raw.githubusercontent.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/$UPSTREAM_SHA/$remote_path" -o /tmp/incoming_zips/"$zipfile" || \
              curl -sL -H "Authorization: token $GH_TOKEN" "https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/raw/$UPSTREAM_SHA/$remote_path" -o /tmp/incoming_zips/"$zipfile"
            done < /tmp/files_to_download.txt
          fi

      - name: Identificar Estritamente os ZIPs Modificados (Fila Unificada)
        id: zips
        if: steps.check.outputs.changed == 'true'
        run: |
          touch /tmp/final_changed_zips.txt
          
          # 1. Se for o modo local exclusivo, pega TODOS os ZIPs do seu repositório
          if [ "${{ steps.check.outputs.mode }}" = "local_only" ]; then
            echo "🔍 Listando todos os arquivos .zip locais..."
            find . -maxdepth 1 -type f -name "*.zip" -printf "%f\n" >> /tmp/final_changed_zips.txt || true
          
          # 2. Se foi push manual seu, pega os seus arquivos alterados
          elif [ "${{ steps.check.outputs.mode }}" = "manual_push" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.event.after }}"
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              git diff-tree --no-commit-id --name-only -r "$AFTER_SHA" | grep -E '\.zip$' >> /tmp/final_changed_zips.txt || true
            else
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -E '\.zip$' >> /tmp/final_changed_zips.txt || true
            fi
          fi

          # 3. Adiciona os arquivos do Skyflare que foram baixados para a fila (se houver)
          if [ -d /tmp/incoming_zips ]; then
            find /tmp/incoming_zips -maxdepth 1 -type f -name "*.zip" -printf "%f\n" >> /tmp/final_changed_zips.txt || true
          fi

          # 4. Remove duplicados
          sort -u /tmp/final_changed_zips.txt -o /tmp/changed_zips.txt

          COUNT=$(wc -l < /tmp/changed_zips.txt || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Arquivos combinados a processar: $COUNT"

      - name: Modificar LUA dentro dos ZIPs Alvos
        if: steps.check.outputs.changed == 'true' && steps.zips.outputs.count != '0'
        run: |
          REPO_DIR=$(pwd)
          
          CACHE_API_STEAM="$REPO_DIR/steam_api_cache.tmp"
          touch "$CACHE_API_STEAM"
          
          while IFS= read -r zipfile; do
            [ -z "$zipfile" ] && continue
            
            zipfile=$(basename "$zipfile")
            tmpdir=$(mktemp -d)
            HAS_LOCAL=false
            
            if [ -f "$REPO_DIR/$zipfile" ]; then
              mkdir -p "$tmpdir/local"
              unzip -q "$REPO_DIR/$zipfile" -d "$tmpdir/local"
              HAS_LOCAL=true
            fi

            mkdir -p "$tmpdir/incoming"
            if [ -f /tmp/incoming_zips/"$zipfile" ]; then
              unzip -q /tmp/incoming_zips/"$zipfile" -d "$tmpdir/incoming"
            elif [ "$HAS_LOCAL" = true ]; then
              unzip -q "$REPO_DIR/$zipfile" -d "$tmpdir/incoming"
            fi

            if [ ! -d "$tmpdir/incoming" ] || [ -z "$(ls -A "$tmpdir/incoming" 2>/dev/null)" ]; then
              rm -rf "$tmpdir"
              continue
            fi

            ANY_LUA_CHANGED=false
            
            while IFS= read -r incoming_lua; do
              [ -z "$incoming_lua" ] && continue
              filename=$(basename "$incoming_lua")
              local_lua="$tmpdir/local/$filename"
              APP_ID=$(basename "$zipfile" .zip)

              REAL_GAMENAME=""

              # 1. Procura por '-- Game: Nome'
              if [ -z "$REAL_GAMENAME" ]; then
                REAL_GAMENAME=$(grep -E "^--\s*Game:\s*" "$incoming_lua" | grep -vE "MAIN APPLICATION|setManifestid|addappid" | head -n 1 | sed -E 's/^--\s*Game:\s*//' | tr -d '\r')
              fi

              # 2. Procura por comentário de cabeçalho
              if [ -z "$REAL_GAMENAME" ]; then
                REAL_GAMENAME=$(grep -E "^-- [A-Za-z0-9]" "$incoming_lua" | grep -vE "Lua and Manifest|Created by|Website:|Total Depots:|provided by|MAIN APPLICATION|setManifestid|addappid" | head -n 1 | sed -E 's/^--\s*//' | tr -d '\r')
              fi

              # 3. Tenta recuperar do arquivo local se o incoming for inválido
              if [ -z "$REAL_GAMENAME" ] || [[ "$REAL_GAMENAME" =~ "MAIN APPLICATION" ]] || [[ "$REAL_GAMENAME" =~ "setManifestid" ]]; then
                if [ "$HAS_LOCAL" = true ] && [ -f "$local_lua" ]; then
                  REAL_GAMENAME=$(grep -E "addappid\(.*\)\s*--" "$local_lua" | grep -vE "provided by|MAIN APPLICATION|addappid|setManifestid" | head -n 1 | sed -E 's/.*--\s*//' | tr -d '\r')
                fi
              fi

              # 4. Procura por addappid que realmente POSSUA comentário na mesma linha
              if [ -z "$REAL_GAMENAME" ]; then
                REAL_GAMENAME=$(grep -E "addappid\(.*--\s*" "$incoming_lua" | grep -vE "Depot|Content|Upgrade|Edition|Pack|Redist|setManifestid" | head -n 1 | sed -E 's/.*--\s*//' | sed -E 's/^[Gg]ame:\s*//' | tr -d '\r')
              fi

              # 5. FILTRO DE SEGURANÇA SEVERO:
              # Se o nome ficou nulo, só números, ou contiver sintaxe de código Lua -> ZERA para chamar a API Steam
              if [ -z "$REAL_GAMENAME" ] || \
                 [[ "$REAL_GAMENAME" =~ ^[0-9]+$ ]] || \
                 [[ "$REAL_GAMENAME" =~ "addappid" ]] || \
                 [[ "$REAL_GAMENAME" =~ "setManifestid" ]] || \
                 [[ "$REAL_GAMENAME" =~ "MAIN APPLICATION" ]] || \
                 [[ "$REAL_GAMENAME" =~ "addtoken" ]] || \
                 [[ "$REAL_GAMENAME" =~ ^Depot\ [0-9]+ ]]; then
                
                REAL_GAMENAME="" # Reseta para forçar API
              fi

              # 6. Consulta APIs da Steam se não conseguiu um nome limpo
              if [ -z "$REAL_GAMENAME" ]; then
                CACHED_NAME=$(grep "^${APP_ID}=" "$CACHE_API_STEAM" | cut -d'=' -f2- || echo "")
                if [ ! -z "$CACHED_NAME" ]; then
                  REAL_GAMENAME="$CACHED_NAME"
                else
                  echo "🌐 Consultando APIs para o ID: $APP_ID"
                  STEAM_NAME=$(curl -s --connect-timeout 4 --max-time 8 "https://store.steampowered.com/api/appdetails?appids=$APP_ID" | jq -r ".\"$APP_ID\".data.name" 2>/dev/null || echo "")
                  if [ -z "$STEAM_NAME" ] || [ "$STEAM_NAME" = "null" ]; then
                    STEAM_NAME=$(curl -s --connect-timeout 4 --max-time 8 "https://store.steampowered.com/api/appdetails?appids=$APP_ID&filters=basic" | jq -r ".\"$APP_ID\".data.name" 2>/dev/null || echo "")
                    if [ -z "$STEAM_NAME" ] || [ "$STEAM_NAME" = "null" ]; then
                      STEAM_NAME=$(curl -s --connect-timeout 4 --max-time 8 "https://steam-tracker.com/api?action=getAppDetails&appid=$APP_ID" | jq -r ".reply.name" 2>/dev/null || echo "")
                    fi
                  fi

                  if [ ! -z "$STEAM_NAME" ] && [ "$STEAM_NAME" != "null" ]; then
                    REAL_GAMENAME="$STEAM_NAME"
                    echo "${APP_ID}=${REAL_GAMENAME}" >> "$CACHE_API_STEAM"
                  else
                    REAL_GAMENAME="$APP_ID"
                  fi
                  sleep 0.15
                fi
              fi

              # Extrai comandos removendo o \r de forma segura
              grep -E "addappid\(|addtoken\(" "$incoming_lua" | sed 's/\r//g' > "$tmpdir/lines.tmp"
              if [ "$HAS_LOCAL" = true ] && [ -f "$local_lua" ]; then
                grep -E "addappid\(|addtoken\(" "$local_lua" | sed 's/\r//g' >> "$tmpdir/lines.tmp"
              fi

              sed -i -E 's/\s*--\s*Game:\s*.*//gI' "$tmpdir/lines.tmp"
              sed -i -E 's/\s*--\s*MAIN APPLICATION.*//gI' "$tmpdir/lines.tmp"
              sort -u "$tmpdir/lines.tmp" | sort -V > "$tmpdir/lines_clean.tmp"

              # Captura do setManifestid para o Lego Batman (2215200) ou outros
              > "$tmpdir/manifests.tmp"
              if [ "$APP_ID" = "2215200" ] || [ "$APP_ID" = "3357650" ] || [ "$APP_ID" = "3321460" ] || [ "$APP_ID" = "3159330" ] || [ "$APP_ID" = "2680010" ]; then
                if [ "$HAS_LOCAL" = true ] && [ -f "$local_lua" ]; then
                  grep -E "setManifestid\(" "$local_lua" | sed 's/\r//g' >> "$tmpdir/manifests.tmp"
                fi
                grep -E "setManifestid\(" "$incoming_lua" | sed 's/\r//g' >> "$tmpdir/manifests.tmp"
                sort -u "$tmpdir/manifests.tmp" > "$tmpdir/manifests_clean.tmp"
              fi

              # --- RECONSTRUÇÃO DO ARQUIVO ---
              printf -- "-- Lua provided by RyzenAPI\n-- Game: %s\n\n" "$REAL_GAMENAME" > "$incoming_lua"
              
              # Seção: MAIN APPLICATION
              if grep -E "addappid\([0-9]+\)$|addappid\([0-9]+\) --" "$tmpdir/lines_clean.tmp" | grep -v -q ","; then
                echo "-- MAIN APPLICATION" >> "$incoming_lua"
                while IFS= read -r linha || [ -n "$linha" ]; do
                  [ -z "$linha" ] && continue
                  echo "$linha" >> "$incoming_lua"
                done < <(grep -E "addappid\([0-9]+\)$|addappid\([0-9]+\) --" "$tmpdir/lines_clean.tmp" | grep -v ",")
                echo "" >> "$incoming_lua"
              fi

              # Seção: MAIN APP DEPOTS / PACKAGES
              if grep -q "," "$tmpdir/lines_clean.tmp"; then
                echo "-- MAIN APP DEPOTS / PACKAGES" >> "$incoming_lua"
                while IFS= read -r linha || [ -n "$linha" ]; do
                  [ -z "$linha" ] && continue
                  echo "$linha" >> "$incoming_lua"
                done < <(grep "," "$tmpdir/lines_clean.tmp")
                echo "" >> "$incoming_lua"
              fi

              # Seção: Correção específica Lego Batman
              if { [ "$APP_ID" = "2215200" ] || [ "$APP_ID" = "3357650" ] || [ "$APP_ID" = "3321460" ] || [ "$APP_ID" = "3159330" ] || [ "$APP_ID" = "2680010" ]; } && [ -s "$tmpdir/manifests_clean.tmp" ]; then
                echo "-- correcao manifest/updates" >> "$incoming_lua"
                while IFS= read -r linha || [ -n "$linha" ]; do
                  [ -z "$linha" ] && continue
                  echo "$linha" >> "$incoming_lua"
                done < "$tmpdir/manifests_clean.tmp"
                echo "" >> "$incoming_lua"
              fi

              sed -i 's/SkyAPI/RyzenAPI/g' "$incoming_lua"
              sed -i 's/skyapi/ryzenapi/g' "$incoming_lua"

              if [ "${{ inputs.full_sync }}" = "true" ] || [ "${{ inputs.only_local_fix }}" = "true" ]; then
                ANY_LUA_CHANGED=true
              elif [ "$HAS_LOCAL" = true ] && [ -f "$local_lua" ]; then
                if ! cmp -s "$incoming_lua" "$local_lua"; then
                  ANY_LUA_CHANGED=true
                fi
              else
                ANY_LUA_CHANGED=true
              fi
            done < <(find "$tmpdir/incoming" -type f -name "*.lua")

            if [ "$ANY_LUA_CHANGED" = true ] || [ "${{ inputs.full_sync }}" = "true" ]; then
              echo "✓ [PROCESSADO] Atualizando e compactando: $zipfile"
              cd "$tmpdir/incoming"
              zip -q -r "$REPO_DIR/$zipfile" .
              cd "$REPO_DIR"
            fi

            rm -rf "$tmpdir"
          done < /tmp/changed_zips.txt
          
          rm -f "$CACHE_API_STEAM"
          rm -rf /tmp/incoming_zips

      - name: Salvar registro do último commit processado
        if: steps.check.outputs.changed == 'true' && (steps.check.outputs.mode == 'upstream_sync' || steps.check.outputs.upstream_news == 'true')
        run: |
          echo "${{ steps.check.outputs.upstream }}" > .last_sha
          echo "✓ Registro do Skyflare guardado em .last_sha."

      - name: Enviar modificações corrigidas de volta para o GitHub
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "*.zip"
          if [ -f .last_sha ]; then git add .last_sha; fi

          STAGED=$(git diff --cached --name-only | grep -E '\.zip$|\.last_sha$' | wc -l || echo "0")
          echo "Postando total de arquivos modificados: $STAGED"

          if [ "$STAGED" -gt 0 ]; then
            git commit -m "bot: patch, assinatura RyzenAPI e sincronização mista aplicados"
            CURRENT_BRANCH=$(git branch --show-current)
            git pull origin "$CURRENT_BRANCH" --rebase
            git push origin "$CURRENT_BRANCH"
            echo "✓ Repositório atualizado!"
          else
            echo "Nenhuma mudança real pendente para commitar."
          fi